<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 400" width="100%" height="100%">
  <defs>
    <linearGradient id="bgCitizen" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0b2545"/>
      <stop offset="100%" stop-color="#14365d"/>
    </linearGradient>
  </defs>
  <rect width="600" height="400" fill="url(#bgCitizen)"/>
  
  <!-- Silhouette citadine en arrière-plan -->
  <circle cx="300" cy="110" r="45" fill="#f8fafc" opacity="0.9"/>
  <!-- Buste citoyen -->
  <path d="M 210,260 C 210,185 240,165 300,165 C 360,165 390,185 390,260 Z" fill="#2f80ed"/>

  <!-- Bras tenant le smartphone -->
  <rect x="265" y="190" width="70" height="130" rx="14" fill="#071322" stroke="#8ecdf7" stroke-width="3"/>
  <rect x="272" y="200" width="56" height="105" rx="8" fill="#f8fafc"/>
  
  <!-- Écran du smartphone avec l'application CITY EYES -->
  <rect x="272" y="200" width="56" height="24" fill="#0b2545"/>
  <text x="300" y="215" fill="#8ecdf7" font-family="system-ui, sans-serif" font-size="6" font-weight="bold" text-anchor="middle">CITY EYES</text>
  
  <circle cx="300" cy="245" r="14" fill="#f2a33a" opacity="0.3"/>
  <circle cx="300" cy="245" r="6" fill="#f2a33a"/>
  
  <rect x="280" y="275" width="40" height="12" rx="6" fill="#2f80ed"/>
  <text x="300" y="283" fill="#ffffff" font-family="system-ui, sans-serif" font-size="5" font-weight="bold" text-anchor="middle">SIGNALER</text>

  <!-- Ondes radio / géolocalisation émises -->
  <circle cx="300" cy="245" r="40" fill="none" stroke="rgba(142, 205, 247, 0.4)" stroke-width="1.5" stroke-dasharray="4 4"/>
  <circle cx="300" cy="245" r="65" fill="none" stroke="rgba(142, 205, 247, 0.25)" stroke-width="1" stroke-dasharray="6 6"/>

  <rect x="20" y="345" width="310" height="32" rx="16" fill="rgba(11, 37, 69, 0.9)" stroke="#2f80ed"/>
  <text x="35" y="366" fill="#ffffff" font-family="system-ui, sans-serif" font-size="12" font-weight="700">Participation citoyenne · Détection collaborative</text>
</svg>
