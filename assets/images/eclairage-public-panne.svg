<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 400" width="100%" height="100%">
  <rect width="600" height="400" fill="#071322"/>
  <!-- Ciel nocturne et silhouette d'immeubles -->
  <rect x="50" y="160" width="120" height="240" fill="#0d2545"/>
  <rect x="420" y="120" width="140" height="280" fill="#0d2545"/>
  <rect y="320" width="600" height="80" fill="#0b1b30"/>
  <!-- Mât de lampadaire urbain -->
  <path d="M 270,360 L 275,100 Q 275,50 330,50 L 350,55" fill="none" stroke="#94a9c4" stroke-width="8" stroke-linecap="round"/>
  <!-- Base du mât -->
  <rect x="255" y="340" width="35" height="40" rx="4" fill="#64748b"/>
  <!-- Crosse et lanterne éteinte -->
  <path d="M 335,55 L 365,65 L 355,85 L 330,75 Z" fill="#475569" stroke="#94a9c4" stroke-width="2"/>
  <circle cx="348" cy="80" r="8" fill="#334155"/>
  <!-- Symbole de panne / ampoule barrée -->
  <g transform="translate(390, 80)">
    <circle cx="0" cy="0" r="18" fill="rgba(242, 163, 58, 0.25)"/>
    <circle cx="0" cy="0" r="8" fill="#f2a33a"/>
    <line x1="-12" y1="-12" x2="12" y2="12" stroke="#ffffff" stroke-width="2.5"/>
  </g>
  <rect x="20" y="345" width="280" height="32" rx="16" fill="rgba(11, 37, 69, 0.9)" stroke="#2f80ed"/>
  <text x="35" y="366" fill="#ffffff" font-family="system-ui, sans-serif" font-size="12" font-weight="700">Catégorie Éclairage · Lampadaire éteint</text>
</svg>
