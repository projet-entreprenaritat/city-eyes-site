<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 400" width="100%" height="100%">
  <rect width="600" height="400" fill="#0f172a"/>
  <!-- Asphalte mouillé -->
  <rect y="180" width="600" height="220" fill="#1e293b"/>
  <!-- Bouche d'égout / regard de vanne avec fuite -->
  <ellipse cx="280" cy="260" rx="70" ry="35" fill="#334155" stroke="#475569" stroke-width="4"/>
  <ellipse cx="280" cy="260" rx="55" ry="25" fill="#0f172a"/>
  <!-- Écoulement d'eau potable avec reflets bleus -->
  <path d="M 280,260 Q 320,290 380,310 T 560,340 L 580,390 L 320,380 Z" fill="rgba(47, 128, 237, 0.45)"/>
  <path d="M 270,265 Q 230,290 180,320 T 40,360 L 20,400 L 220,390 Z" fill="rgba(47, 128, 237, 0.35)"/>
  <!-- Bulles et éclaboussures -->
  <circle cx="280" cy="245" r="8" fill="#8ecdf7" opacity="0.8"/>
  <circle cx="295" cy="235" r="5" fill="#8ecdf7" opacity="0.7"/>
  <circle cx="265" cy="238" r="6" fill="#8ecdf7" opacity="0.7"/>
  <!-- Tag Alerte Eau -->
  <g transform="translate(280, 210)">
    <circle cx="0" cy="0" r="18" fill="rgba(47, 128, 237, 0.3)"/>
    <circle cx="0" cy="0" r="8" fill="#2f80ed"/>
  </g>
  <rect x="20" y="345" width="280" height="32" rx="16" fill="rgba(11, 37, 69, 0.9)" stroke="#2f80ed"/>
  <text x="35" y="366" fill="#ffffff" font-family="system-ui, sans-serif" font-size="12" font-weight="700">Catégorie Eau · Fuite sur chaussée</text>
</svg>
