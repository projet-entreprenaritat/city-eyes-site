<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 400" width="100%" height="100%">
  <rect width="600" height="400" fill="#0f172a"/>
  <!-- Trottoir et caniveau -->
  <rect y="260" width="600" height="140" fill="#1e293b"/>
  <line x1="0" y1="260" x2="600" y2="260" stroke="#475569" stroke-width="6"/>
  <!-- Conteneur à déchets / Benne débordante -->
  <rect x="180" y="140" width="160" height="150" rx="8" fill="#10b981" stroke="#059669" stroke-width="3"/>
  <rect x="170" y="125" width="180" height="20" rx="6" fill="#059669"/>
  <!-- Roues de la benne -->
  <circle cx="210" cy="295" r="14" fill="#020617" stroke="#94a9c4" stroke-width="3"/>
  <circle cx="310" cy="295" r="14" fill="#020617" stroke="#94a9c4" stroke-width="3"/>
  <!-- Débordements / sacs abandonnés au sol -->
  <ellipse cx="370" cy="275" rx="35" ry="25" fill="#334155"/>
  <ellipse cx="430" cy="285" rx="30" ry="20" fill="#475569"/>
  <ellipse cx="140" cy="280" rx="28" ry="18" fill="#334155"/>
  <!-- Alerte tag -->
  <g transform="translate(370, 240)">
    <circle cx="0" cy="0" r="16" fill="rgba(239, 68, 68, 0.3)"/>
    <circle cx="0" cy="0" r="8" fill="#ef4444"/>
    <text x="0" y="3" fill="#ffffff" font-size="10" font-weight="bold" text-anchor="middle">!</text>
  </g>
  <rect x="20" y="345" width="280" height="32" rx="16" fill="rgba(11, 37, 69, 0.9)" stroke="#2f80ed"/>
  <text x="35" y="366" fill="#ffffff" font-family="system-ui, sans-serif" font-size="12" font-weight="700">Catégorie Propreté · Dépôt sauvage</text>
</svg>
