<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 400" width="100%" height="100%">
  <rect width="600" height="400" fill="#1e293b"/>
  <!-- Asphalte avec marquage routier blanc usé -->
  <line x1="0" y1="200" x2="600" y2="200" stroke="#f8fafc" stroke-width="8" stroke-dasharray="40 30" opacity="0.4"/>
  <!-- Fissures et nid-de-poule -->
  <path d="M 180,160 Q 240,120 320,150 Q 420,130 460,190 Q 440,260 360,270 Q 260,280 200,240 Z" fill="#0f172a" stroke="#f2a33a" stroke-width="2.5"/>
  <!-- Profondeur du nid-de-poule -->
  <path d="M 220,180 Q 280,160 350,180 Q 400,210 370,240 Q 300,250 240,230 Z" fill="#020617"/>
  <!-- Gravillons et débris -->
  <circle cx="210" cy="150" r="3" fill="#94a9c4"/>
  <circle cx="380" cy="160" r="4" fill="#94a9c4"/>
  <circle cx="430" cy="240" r="3.5" fill="#94a9c4"/>
  <circle cx="270" cy="265" r="2.5" fill="#94a9c4"/>
  <!-- Balise de signalement CITY EYES sur le trou -->
  <g transform="translate(320, 190)">
    <circle cx="0" cy="0" r="18" fill="rgba(242, 163, 58, 0.3)"/>
    <circle cx="0" cy="0" r="8" fill="#f2a33a"/>
    <path d="M 0,-15 L 0,-30 M -15,0 L -30,0 M 0,15 L 0,30 M 15,0 L 30,0" stroke="#f2a33a" stroke-width="2"/>
  </g>
  <rect x="20" y="345" width="280" height="32" rx="16" fill="rgba(11, 37, 69, 0.9)" stroke="#2f80ed"/>
  <text x="35" y="366" fill="#ffffff" font-family="system-ui, sans-serif" font-size="12" font-weight="700">Catégorie Voirie · Nid-de-poule</text>
</svg>
