<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 380" width="100%" height="100%">
  <defs>
    <linearGradient id="dashBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0b2545"/>
      <stop offset="100%" stop-color="#071322"/>
    </linearGradient>
  </defs>

  <rect width="600" height="380" rx="16" fill="url(#dashBg)"/>

  <!-- Barre supérieure dashboard -->
  <rect x="0" y="0" width="600" height="50" fill="#0d2038" rx="16 16 0 0"/>
  <text x="25" y="32" fill="#ffffff" font-family="system-ui, sans-serif" font-size="14" font-weight="800">CITY EYES · Console Partenaires &amp; Services Municipaux</text>
  
  <rect x="440" y="14" width="140" height="24" rx="12" fill="rgba(242, 163, 58, 0.2)" stroke="#f2a33a"/>
  <text x="510" y="30" fill="#f2a33a" font-family="system-ui, sans-serif" font-size="9" font-weight="700" text-anchor="middle">SIMULATION CONCEPT</text>

  <!-- Métriques clés -->
  <rect x="25" y="70" width="125" height="70" rx="10" fill="#102540" stroke="rgba(142, 205, 247, 0.15)"/>
  <text x="35" y="92" fill="#94a9c4" font-family="system-ui, sans-serif" font-size="10">Alertes actives</text>
  <text x="35" y="125" fill="#2f80ed" font-family="system-ui, sans-serif" font-size="22" font-weight="800">42</text>

  <rect x="165" y="70" width="125" height="70" rx="10" fill="#102540" stroke="rgba(142, 205, 247, 0.15)"/>
  <text x="175" y="92" fill="#94a9c4" font-family="system-ui, sans-serif" font-size="10">Interventions en cours</text>
  <text x="175" y="125" fill="#f2a33a" font-family="system-ui, sans-serif" font-size="22" font-weight="800">18</text>

  <rect x="305" y="70" width="125" height="70" rx="10" fill="#102540" stroke="rgba(142, 205, 247, 0.15)"/>
  <text x="315" y="92" fill="#94a9c4" font-family="system-ui, sans-serif" font-size="10">Résolus ce mois</text>
  <text x="315" y="125" fill="#10b981" font-family="system-ui, sans-serif" font-size="22" font-weight="800">156</text>

  <rect x="445" y="70" width="130" height="70" rx="10" fill="#102540" stroke="rgba(142, 205, 247, 0.15)"/>
  <text x="455" y="92" fill="#94a9c4" font-family="system-ui, sans-serif" font-size="10">Délai moyen</text>
  <text x="455" y="125" fill="#8ecdf7" font-family="system-ui, sans-serif" font-size="22" font-weight="800">36 h</text>

  <!-- Table des interventions prioritaires -->
  <rect x="25" y="160" width="550" height="195" rx="12" fill="#0d2038" stroke="rgba(142, 205, 247, 0.15)"/>
  <text x="40" y="185" fill="#ffffff" font-family="system-ui, sans-serif" font-size="12" font-weight="700">Derniers signalements priorisés (simulation)</text>

  <!-- Lignes du tableau -->
  <line x1="25" y1="200" x2="575" y2="200" stroke="rgba(142, 205, 247, 0.1)"/>
  
  <text x="40" y="225" fill="#ffffff" font-family="system-ui, sans-serif" font-size="10">#0842 · Voirie</text>
  <text x="140" y="225" fill="#94a9c4" font-family="system-ui, sans-serif" font-size="10">Nid-de-poule profond</text>
  <text x="310" y="225" fill="#ef4444" font-family="system-ui, sans-serif" font-size="10" font-weight="bold">Urgence haute (8 votes)</text>
  <text x="460" y="225" fill="#f2a33a" font-family="system-ui, sans-serif" font-size="10">Assigné équipe 2</text>

  <line x1="25" y1="245" x2="575" y2="245" stroke="rgba(142, 205, 247, 0.1)"/>

  <text x="40" y="270" fill="#ffffff" font-family="system-ui, sans-serif" font-size="10">#0841 · Éclairage</text>
  <text x="140" y="270" fill="#94a9c4" font-family="system-ui, sans-serif" font-size="10">3 lampadaires éteints</text>
  <text x="310" y="270" fill="#f2a33a" font-family="system-ui, sans-serif" font-size="10" font-weight="bold">Urgence moyenne (3 votes)</text>
  <text x="460" y="270" fill="#8ecdf7" font-family="system-ui, sans-serif" font-size="10">En attente pièce</text>

  <line x1="25" y1="290" x2="575" y2="290" stroke="rgba(142, 205, 247, 0.1)"/>

  <text x="40" y="315" fill="#ffffff" font-family="system-ui, sans-serif" font-size="10">#0840 · Propreté</text>
  <text x="140" y="315" fill="#94a9c4" font-family="system-ui, sans-serif" font-size="10">Dépôt sauvage encombrant</text>
  <text x="310" y="315" fill="#10b981" font-family="system-ui, sans-serif" font-size="10" font-weight="bold">Programmé (rotation)</text>
  <text x="460" y="315" fill="#10b981" font-family="system-ui, sans-serif" font-size="10">Tournée du soir</text>
</svg>
