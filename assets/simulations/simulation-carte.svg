<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 380" width="100%" height="100%">
  <defs>
    <linearGradient id="mapBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#071322"/>
      <stop offset="100%" stop-color="#0b2545"/>
    </linearGradient>
  </defs>

  <rect width="600" height="380" rx="16" fill="url(#mapBg)"/>

  <!-- Côte Atlantique Casablanca (illustration schématique) -->
  <path d="M 0,0 L 600,0 L 600,85 C 480,95 380,115 300,100 C 200,80 120,130 0,110 Z" fill="#0d2545"/>
  <text x="20" y="40" fill="#8ecdf7" font-family="system-ui, sans-serif" font-size="12" font-weight="700" letter-spacing="2">OCÉAN ATLANTIQUE</text>

  <!-- Réseau de voies urbaines -->
  <g stroke="rgba(142, 205, 247, 0.18)" stroke-width="3" fill="none">
    <path d="M 0,120 Q 200,100 340,130 T 600,150"/>
    <path d="M 300,100 L 320,380"/>
    <path d="M 140,380 L 260,110"/>
    <path d="M 340,130 L 540,380"/>
    <path d="M 60,200 Q 300,170 580,210"/>
  </g>

  <!-- Points d'anomalies (Schématiques) -->
  <g transform="translate(240, 170)">
    <circle cx="0" cy="0" r="14" fill="rgba(242, 163, 58, 0.25)"/>
    <circle cx="0" cy="0" r="6" fill="#f2a33a"/>
    <text x="12" y="4" fill="#ffffff" font-family="system-ui, sans-serif" font-size="10" font-weight="bold">Voirie (Nid-de-poule)</text>
  </g>

  <g transform="translate(120, 130)">
    <circle cx="0" cy="0" r="14" fill="rgba(47, 128, 237, 0.25)"/>
    <circle cx="0" cy="0" r="6" fill="#2f80ed"/>
    <text x="12" y="4" fill="#ffffff" font-family="system-ui, sans-serif" font-size="10" font-weight="bold">Éclairage public</text>
  </g>

  <g transform="translate(380, 140)">
    <circle cx="0" cy="0" r="14" fill="rgba(16, 185, 129, 0.25)"/>
    <circle cx="0" cy="0" r="6" fill="#10b981"/>
    <text x="12" y="4" fill="#ffffff" font-family="system-ui, sans-serif" font-size="10" font-weight="bold">Propreté urbaine</text>
  </g>

  <g transform="translate(220, 270)">
    <circle cx="0" cy="0" r="14" fill="rgba(239, 68, 68, 0.25)"/>
    <circle cx="0" cy="0" r="6" fill="#ef4444"/>
    <text x="12" y="4" fill="#ffffff" font-family="system-ui, sans-serif" font-size="10" font-weight="bold">Sécurité piétons</text>
  </g>

  <!-- Tag Simulation -->
  <rect x="20" y="340" width="340" height="24" rx="12" fill="rgba(11, 37, 69, 0.85)" stroke="rgba(242, 163, 58, 0.4)"/>
  <text x="30" y="356" fill="#f2a33a" font-family="system-ui, sans-serif" font-size="9" font-weight="700">SIMULATION — Illustration schématique, non cartographique</text>
</svg>
