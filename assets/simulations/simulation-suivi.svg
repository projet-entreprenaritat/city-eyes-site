<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 650" width="100%" height="100%">
  <defs>
    <linearGradient id="headerGrad2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0b2545"/>
      <stop offset="100%" stop-color="#2f80ed"/>
    </linearGradient>
    <filter id="cardShadow2" x="-10%" y="-5%" width="120%" height="115%">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-opacity="0.12"/>
    </filter>
  </defs>

  <rect x="5" y="5" width="390" height="640" rx="36" fill="#0b2545" stroke="#2f80ed" stroke-width="2"/>
  <rect x="15" y="15" width="370" height="620" rx="28" fill="#f8fafc"/>

  <rect x="140" y="20" width="120" height="18" rx="9" fill="#0b2545"/>
  <circle cx="230" cy="29" r="4" fill="#2f80ed"/>

  <rect x="15" y="48" width="370" height="60" fill="url(#headerGrad2)"/>
  <text x="35" y="85" fill="#ffffff" font-family="system-ui, sans-serif" font-size="18" font-weight="800">CITY EYES</text>
  <text x="35" y="100" fill="#8ecdf7" font-family="system-ui, sans-serif" font-size="11">Suivi du ticket #CE-2026-0842</text>

  <rect x="255" y="68" width="115" height="22" rx="11" fill="rgba(242, 163, 58, 0.25)" stroke="#f2a33a" stroke-width="1"/>
  <text x="312" y="83" fill="#ffffff" font-family="system-ui, sans-serif" font-size="9" font-weight="700" text-anchor="middle">SIMULATION</text>

  <!-- Étape Statut -->
  <rect x="35" y="125" width="330" height="110" rx="16" fill="#ffffff" stroke="#e2e8f0" stroke-width="1" filter="url(#cardShadow2)"/>
  <text x="50" y="150" fill="#0b2545" font-family="system-ui, sans-serif" font-size="14" font-weight="800">État de la prise en charge</text>
  
  <!-- Ligne de statut -->
  <line x1="60" y1="185" x2="300" y2="185" stroke="#e2e8f0" stroke-width="4"/>
  <line x1="60" y1="185" x2="180" y2="185" stroke="#10b981" stroke-width="4"/>

  <circle cx="60" cy="185" r="12" fill="#10b981"/>
  <text x="60" y="189" fill="#ffffff" font-size="10" font-weight="bold" text-anchor="middle">✓</text>
  <text x="60" y="212" fill="#0b2545" font-family="system-ui, sans-serif" font-size="10" font-weight="700" text-anchor="middle">Signalé</text>

  <circle cx="180" cy="185" r="12" fill="#2f80ed"/>
  <text x="180" y="189" fill="#ffffff" font-size="10" font-weight="bold" text-anchor="middle">⚙</text>
  <text x="180" y="212" fill="#2f80ed" font-family="system-ui, sans-serif" font-size="10" font-weight="700" text-anchor="middle">En cours</text>

  <circle cx="300" cy="185" r="12" fill="#cbd5e1"/>
  <text x="300" y="212" fill="#94a9c4" font-family="system-ui, sans-serif" font-size="10" text-anchor="middle">Résolu</text>

  <!-- Détails intervention -->
  <rect x="35" y="255" width="330" height="190" rx="16" fill="#ffffff" stroke="#e2e8f0" stroke-width="1" filter="url(#cardShadow2)"/>
  <text x="50" y="285" fill="#0b2545" font-family="system-ui, sans-serif" font-size="13" font-weight="700">Détails de l'intervention</text>
  
  <text x="50" y="315" fill="#53657d" font-family="system-ui, sans-serif" font-size="11">Type : Voirie (Nid-de-poule dangereux)</text>
  <text x="50" y="335" fill="#53657d" font-family="system-ui, sans-serif" font-size="11">Lieu : Boulevard Zerktouni (Quartier Maârif)</text>
  <text x="50" y="355" fill="#53657d" font-family="system-ui, sans-serif" font-size="11">Équipe assignée : Maintenance de voirie</text>
  <text x="50" y="375" fill="#53657d" font-family="system-ui, sans-serif" font-size="11">Délai estimé : Intervention sous 24-48h</text>

  <rect x="50" y="395" width="300" height="35" rx="8" fill="rgba(16, 185, 129, 0.1)"/>
  <text x="60" y="417" fill="#10b981" font-family="system-ui, sans-serif" font-size="11" font-weight="700">6 citoyens ont confirmé ce problème</text>

  <!-- Notification de suivi -->
  <rect x="35" y="465" width="330" height="75" rx="14" fill="#0d2038" filter="url(#cardShadow2)"/>
  <text x="55" y="495" fill="#ffffff" font-family="system-ui, sans-serif" font-size="12" font-weight="700">🔔 Notifications en direct</text>
  <text x="55" y="515" fill="#94a9c4" font-family="system-ui, sans-serif" font-size="10">Vous serez prévenu par notification push lors de la clôture.</text>

  <text x="200" y="595" fill="#94a9c4" font-family="system-ui, sans-serif" font-size="9" text-anchor="middle">Maquette conceptuelle — Écran indicatif</text>
</svg>
