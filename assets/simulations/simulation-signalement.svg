<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 650" width="100%" height="100%">
  <defs>
    <linearGradient id="headerGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0b2545"/>
      <stop offset="100%" stop-color="#2f80ed"/>
    </linearGradient>
    <filter id="cardShadow" x="-10%" y="-5%" width="120%" height="115%">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-opacity="0.12"/>
    </filter>
  </defs>

  <!-- Châssis smartphone moderne -->
  <rect x="5" y="5" width="390" height="640" rx="36" fill="#0b2545" stroke="#2f80ed" stroke-width="2"/>
  <rect x="15" y="15" width="370" height="620" rx="28" fill="#f8fafc"/>

  <!-- Encoche supérieure -->
  <rect x="140" y="20" width="120" height="18" rx="9" fill="#0b2545"/>
  <circle cx="230" cy="29" r="4" fill="#2f80ed"/>

  <!-- En-tête application -->
  <rect x="15" y="48" width="370" height="60" fill="url(#headerGrad)"/>
  <text x="35" y="85" fill="#ffffff" font-family="system-ui, sans-serif" font-size="18" font-weight="800">CITY EYES</text>
  <text x="35" y="100" fill="#8ecdf7" font-family="system-ui, sans-serif" font-size="11">Nouveau signalement citoyen</text>

  <!-- Tag de simulation obligatoire -->
  <rect x="255" y="68" width="115" height="22" rx="11" fill="rgba(242, 163, 58, 0.25)" stroke="#f2a33a" stroke-width="1"/>
  <text x="312" y="83" fill="#ffffff" font-family="system-ui, sans-serif" font-size="9" font-weight="700" text-anchor="middle">SIMULATION</text>

  <!-- Zone Photo -->
  <rect x="35" y="125" width="330" height="160" rx="16" fill="#071322" stroke="#2f80ed" stroke-width="1.5" stroke-dasharray="4 4" filter="url(#cardShadow)"/>
  <circle cx="200" cy="190" r="28" fill="rgba(47, 128, 237, 0.15)"/>
  <path d="M 185,190 L 215,190 M 200,175 L 200,205" stroke="#2f80ed" stroke-width="3" stroke-linecap="round"/>
  <text x="200" y="235" fill="#8ecdf7" font-family="system-ui, sans-serif" font-size="13" font-weight="600" text-anchor="middle">1. Photo du problème (Nid-de-poule)</text>
  <text x="200" y="252" fill="#94a9c4" font-family="system-ui, sans-serif" font-size="10" text-anchor="middle">Aperçu capturé à Casablanca</text>

  <!-- Zone GPS -->
  <rect x="35" y="300" width="330" height="70" rx="14" fill="#ffffff" stroke="#e2e8f0" stroke-width="1" filter="url(#cardShadow)"/>
  <circle cx="65" cy="335" r="16" fill="rgba(242, 163, 58, 0.15)"/>
  <path d="M 65,324 C 59,324 54,329 54,335 C 54,343 65,353 65,353 C 65,353 76,343 76,335 C 76,329 71,324 65,324 Z" fill="#f2a33a"/>
  <circle cx="65" cy="334" r="3" fill="#ffffff"/>
  <text x="95" y="330" fill="#0b2545" font-family="system-ui, sans-serif" font-size="13" font-weight="700">2. Position GPS automatique</text>
  <text x="95" y="348" fill="#53657d" font-family="system-ui, sans-serif" font-size="11">Bd Zerktouni, Maârif · Précision ±3m</text>

  <!-- Zone Catégorie -->
  <rect x="35" y="385" width="330" height="110" rx="14" fill="#ffffff" stroke="#e2e8f0" stroke-width="1" filter="url(#cardShadow)"/>
  <text x="50" y="410" fill="#0b2545" font-family="system-ui, sans-serif" font-size="13" font-weight="700">3. Catégorie sélectionnée</text>
  
  <rect x="50" y="425" width="85" height="30" rx="15" fill="#2f80ed"/>
  <text x="92" y="445" fill="#ffffff" font-family="system-ui, sans-serif" font-size="11" font-weight="700" text-anchor="middle">Voirie ✓</text>

  <rect x="145" y="425" width="95" height="30" rx="15" fill="#f1f5f9"/>
  <text x="192" y="445" fill="#53657d" font-family="system-ui, sans-serif" font-size="11" text-anchor="middle">Propreté</text>

  <rect x="250" y="425" width="95" height="30" rx="15" fill="#f1f5f9"/>
  <text x="297" y="445" fill="#53657d" font-family="system-ui, sans-serif" font-size="11" text-anchor="middle">Éclairage</text>

  <text x="50" y="480" fill="#53657d" font-family="system-ui, sans-serif" font-size="11">Description : « Chaussée dégradée gênant la circulation »</text>

  <!-- Bouton d'action -->
  <rect x="35" y="520" width="330" height="48" rx="24" fill="#2f80ed" filter="url(#cardShadow)"/>
  <text x="200" y="550" fill="#ffffff" font-family="system-ui, sans-serif" font-size="14" font-weight="700" text-anchor="middle">4. Envoyer le signalement</text>

  <!-- Mention légale basse -->
  <text x="200" y="595" fill="#94a9c4" font-family="system-ui, sans-serif" font-size="9" text-anchor="middle">Maquette conceptuelle — Écran indicatif</text>
</svg>
